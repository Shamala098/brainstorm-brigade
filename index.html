<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(270deg,#141e30,#243b55);
background-size:400% 400%;
animation:bg 12s infinite;
color:white;
text-align:center;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Title Style */

h1{
margin-top:40px;
font-size:60px;
letter-spacing:2px;
}

/* Description below title */

.description{
font-size:20px;
margin-top:10px;
margin-bottom:30px;
color:#dcdcdc;
max-width:800px;
margin-left:auto;
margin-right:auto;
}

/* AI TEAM BOX */

.team-box{
display:inline-block;
margin-top:10px;
margin-bottom:30px;
padding:12px 25px;
border-radius:20px;
background:rgba(0,255,255,0.15);
border:1px solid cyan;
font-size:22px;
box-shadow:0 0 15px cyan;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 10px cyan;}
to{box-shadow:0 0 25px cyan;}
}

/* Role Badge */

.role{
font-size:14px;
background:rgba(0,255,255,0.2);
border:1px solid cyan;
padding:4px 10px;
border-radius:10px;
display:inline-block;
margin-bottom:8px;
}

/* Team Cards */

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:30px;
}

.card{
background:rgba(255,255,255,0.08);
padding:20px;
margin:15px;
width:230px;
border-radius:15px;
transition:0.4s;
backdrop-filter:blur(10px);
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 20px cyan;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
margin-bottom:10px;
}

.icons i{
font-size:16px;
margin:6px;
color:white;
}

button{
margin-top:10px;
padding:8px 14px;
border:none;
background:cyan;
border-radius:15px;
cursor:pointer;
}

button:hover{
background:white;
}

</style>

</head>
