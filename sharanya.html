<!DOCTYPE html>

<html>
<head>
<title>Sharanya Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family:Arial;
margin:0;
color:white;
padding:40px;
background:linear-gradient(270deg,#0f2027,#203a43,#2c5364);
background-size:600% 600%;
animation:bgmove 12s infinite;
overflow-x:hidden;
}

/* AI Animated Background */
@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
text-align:center;
font-size:40px;
margin-bottom:40px;
letter-spacing:2px;
}

/* Card Style */
.card{
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:15px;
margin-bottom:25px;
backdrop-filter:blur(10px);
transition:0.4s;
box-shadow:0 0 15px rgba(0,255,255,0.2);
}

/* Hover Animation */
.card:hover{
transform:translateY(-8px) scale(1.02);
box-shadow:0 0 25px cyan;
}

/* Title decoration */
h2{
border-left:5px solid cyan;
padding-left:10px;
}

/* Back Button */
.back{
display:inline-block;
margin-top:20px;
padding:10px 18px;
background:cyan;
color:black;
border-radius:20px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.back:hover{
background:white;
transform:scale(1.08);
}

/* Floating particles */

.particle{
position:absolute;
width:6px;
height:6px;
background:cyan;
border-radius:50%;
opacity:0.6;
animation:float 10s infinite linear;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(0);
}
100%{
transform:translateY(-10vh) scale(1);
}
}

</style>

</head>

<body>

<h1>🤖 J Sharanya Portfolio</h1>

<div class="card">
<h2>🎓 Education</h2>
<p>BVRIT Hyderabad College of Engineering for Women – CGPA 8.85</p>
</div>

<div class="card">
<h2>💻 Projects</h2>
<ul>
<li>Balloon Simulation using Python</li>
<li>Student Connect Web App</li>
</ul>
</div>

<div class="card">
<h2>🧠 Skills</h2>
<p>C, Python, MATLAB</p>
</div>

<div class="card">
<h2>📜 Certifications</h2>
<p>Infosys Springboard</p>
</div>

<a class="back" href="index.html">⬅ Back to Team</a>

<!-- AI Floating Particles -->

<script>

function createParticle(){
const particle=document.createElement("div");
particle.classList.add("particle");

particle.style.left=Math.random()*100+"vw";
particle.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(particle);

setTimeout(()=>{
particle.remove();
},10000);
}

setInterval(createParticle,400);

</script>

</body>
</html>
